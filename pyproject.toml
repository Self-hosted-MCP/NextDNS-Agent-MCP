[project]
name = "nextdns-agent-mcp"
version = "0.8.5"
description = "Your NextDNS account in Claude, ChatGPT and other AI apps: read stats and logs, change blocklists and settings, with safe limits per profile."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "cryptography>=44",
    "pillow>=11",
]
keywords = ["mcp", "nextdns", "dns", "claude", "self-hosted"]

[project.scripts]
nextdns-agent-mcp = "nextdns_agent_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Self-hosted-MCP/NextDNS-Agent-MCP"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, bad comparisons, duplicate dict keys, unused variables, empty f-strings.
# Run in CI with: uvx --from ruff==0.17.2 ruff check .
select = ["E9", "F63", "F7", "F82", "F601", "F541", "F841"]
