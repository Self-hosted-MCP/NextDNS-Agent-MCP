[project]
name = "nextdns-agent-mcp"
version = "0.6.3"
description = "Your NextDNS account in Claude, ChatGPT and other AI apps: read stats and logs, change blocklists and settings, with safe limits per profile."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "cryptography>=44",
    "pillow>=11",
]
keywords = ["mcp", "nextdns", "dns", "claude", "self-hosted"]

[project.scripts]
nextdns-agent-mcp = "nextdns_agent_mcp.server:main"

[project.urls]
Homepage = "https://github.com/s17sh70x2jfl031ag/NextDNS-Agent-MCP"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
